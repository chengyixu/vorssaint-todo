name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  guards:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/repo-guards.sh
      - run: bash scripts/todo-guards.sh

  ci-success:
    if: always()
    needs: [lint, typecheck, test, guards]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate gate
        run: |
          for r in "${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.test.result }}" "${{ needs.guards.result }}"; do
            if [ "$r" != "success" ]; then
              echo "lane failed: $r"
              exit 1
            fi
          done
          echo "ci-success"
